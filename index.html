  else if(kind==='ARCHIVE'){const d=current(p.id);const old=d.status==='IN_CABINET'?removeFromStack(d):{cell:d.lastCell,position:d.lastOrder};const seq='LT-'+String(db.nextArchiveNo++).padStart(4,'0');const pos=getStack(p.cell).length+1;d.cell=p.cell;d.status='ARCHIVED';d.orderFromBottom=pos;d.archiveNo=seq;d.archivedAt=dateNow();d.borrower='';d.borrowedAt='';d.lastCell=old.cell;d.lastOrder=old.position;activeCell=p.cell;selectedId=d.id;logEvent(`LƯU TRỮ ${d.code}: ${prettyCell(old.cell)} #${old.position} → ${prettyCell(p.cell)} #${pos}, số ${seq}.`);result=`Đã lưu trữ ${d.code} tại ${p.cell}, cấp số ${seq}.`;}
  else if(kind==='ADD'){const d={id:freshId(),year:p.year,code:p.code,name:p.name,bank:p.bank,status:'IN_CABINET',cell:p.cell,orderFromBottom:getStack(p.cell).length+1,borrower:'',lastCell:null,lastOrder:0,archiveNo:null,borrowedAt:'',archivedAt:''};db.dossiers.push(d);selectedId=d.id;activeCell=d.cell;logEvent(`THÊM ${d.code} (${d.name}) tại ${d.cell} #${d.orderFromBottom}; chế độ ${p.mode}.`);result=`Đã thêm ${d.code} tại ${prettyCell(d.cell)}, tập #${d.orderFromBottom}.`;addValues={year:'2026',code:'',name:'',bank:'',cell:p.cell};}
  else if(kind==='ARRANGE'){const plan=planByYear(db.dossiers,db.locked,db.capacity);applyPlanTo(db.dossiers,plan);logEvent(`XẾP NĂM: bố trí ${Object.keys(plan).length} hồ sơ trong các ngăn chưa khóa (ưu tiên theo năm).`);result=`Đã xếp ${Object.keys(plan).length} hồ sơ theo năm; không thay đổi hồ sơ đang rút và đã lưu trữ.`;}
  else if(kind==='CAPACITY'){const prev=db.capacity;db.capacity=p.limit;logEvent(`ĐIỀU CHỈNH SỨC CHỨA: ${prev} → ${db.capacity} hồ sơ/ngăn.`);result=`Đã đổi mức tối đa thành ${db.capacity} hồ sơ/ngăn.`;}
  else if(kind==='LOCK'){const had=db.locked.includes(p.cell);db.locked=had?db.locked.filter(c=>c!==p.cell):[...db.locked,p.cell];logEvent(`${had?'MỞ KHÓA':'KHÓA'} ngăn ${p.cell} (không thêm hồ sơ mới vào ngăn khóa).`);result=`Đã ${had?'mở khóa':'khóa'} ngăn ${p.cell}.`;}
  else if(kind==='CLEAR'){if(($('clearPhrase')?.value||'').trim().toUpperCase()!=='LAM TRONG TU')throw Error('Cần nhập đúng LAM TRONG TU để xác nhận');for(const d of db.dossiers){d.status='UNPLACED';d.cell=null;d.orderFromBottom=0;d.borrower='';d.lastCell=null;d.lastOrder=0;d.borrowedAt='';}logEvent(`LÀM TRỐNG TỦ: giải phóng 24 ngăn; vẫn giữ ${db.dossiers.length} hồ sơ trong danh mục, giữ số lưu trữ đã cấp.`);result=`Đã làm trống 24 ngăn; vẫn giữ ${db.dossiers.length} hồ sơ để xếp lại.`;}
  else if(kind==='IMPORT'){const imported=sanitizeDb(p.data);const prevTotal=db.dossiers.length;db=imported;logEvent(`NHẬP DỮ LIỆU JSON: thay thế ${prevTotal} hồ sơ bằng ${db.dossiers.length} hồ sơ.`);result=`Đã nhập ${db.dossiers.length} hồ sơ và thiết lập từ JSON.`;}

  if(['REORDER','WITHDRAW','RETURN','ARCHIVE','ADD','ARRANGE','CAPACITY','LOCK','CLEAR','IMPORT'].includes(kind)){

  }

 }catch(e){notice={kind:'error',text:e.message};renderGreen();}
}
function proposeAutoCell(year){const avail=ACTIVE_CELLS.filter(c=>available(c));if(!avail.length)return null;const byYear=ACTIVE_CELLS.filter(c=>getStack(c).some(d=>d.year===year));let exact=byYear.find(c=>avail.includes(c)&&getStack(c).every(d=>d.year===year));if(exact)return exact;
 const yrCells=byYear.map(c=>ACTIVE_CELLS.indexOf(c));const target=yrCells.length?Math.max(...yrCells)+1:0;const unoccupied=avail.filter(c=>getStack(c).length===0);return unoccupied.find(c=>ACTIVE_CELLS.indexOf(c)>=target)||unoccupied[0]||avail[0];}
function exportJson(){const txt=JSON.stringify({schema:'MN-CABINET-V7',exportedAt:new Date().toISOString(),...db},null,2);saveBlob(txt,'application/json;charset=utf-8',`MN_tu_ho_so_${new Date().toISOString().slice(0,10)}.json`)}
function exportHtml(){const safe=JSON.stringify(db).replace(/</g,'\\u003c').replace(/>/g,'\\u003e').replace(/&/g,'\\u0026');const block=`/*__EMBEDDED_SNAPSHOT_START__*/\nconst EMBEDDED_SNAPSHOT = ${safe};\n/*__EMBEDDED_SNAPSHOT_END__*/`;const current='<!DOCTYPE html>\n'+document.documentElement.outerHTML;const html=current.replace(/\/\*__EMBEDDED_SNAPSHOT_START__\*\/[\s\S]*?\/\*__EMBEDDED_SNAPSHOT_END__\*\//,block);saveBlob(html,'text/html;charset=utf-8','index.html')}
function saveBlob(textData,type,name){const url=URL.createObjectURL(new Blob([textData],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}

function prepareArrange(){try{const p=planByYear(db.dossiers,db.locked,db.capacity);const planned=deep(db.dossiers);applyPlanTo(planned,p);verifyDossiers(planned,db.capacity);const changes=Object.keys(p).filter(id=>{const d=current(id),t=p[id];return d.cell!==t.cell||d.orderFromBottom!==t.orderFromBottom}).length;setStage('ARRANGE',{changes,assigned:Object.keys(p).length},`Xếp theo năm ${Object.keys(p).length} hồ sơ, dự kiến thay đổi vị trí của ${changes} hồ sơ. Các ngăn khóa, hồ sơ đang rút/lưu trữ được giữ nguyên.`)}catch(e){notice={kind:'error',text:e.message};renderGreen()}}
function prepareLock(){const cell=$('lockCell').value;setStage('LOCK',{cell},`${db.locked.includes(cell)?'Mở khóa':'Khóa'} ${prettyCell(cell)}. Số hồ sơ hiện có: ${occupancy(cell)}/${db.capacity}.`)}
function prepareCapacity(){const limit=Number($('capacityInput').value);if(!Number.isInteger(limit)||limit<1||limit>500){notice={kind:'error',text:'Nhập từ 1 đến 500.'};renderGreen();return;}const over=ALL_CELLS.filter(c=>occupancy(c)>limit);setStage('CAPACITY',{limit,over},`Điều chỉnh giới hạn từ ${db.capacity} lên/xuống ${limit} hồ sơ/ngăn.${over.length?' Cảnh báo: vượt giới hạn ở '+over.join(', '):''}`)}
function prepareClear(){setStage('CLEAR',{},`Làm trống toàn bộ 24 ngăn, giữ lại danh mục ${db.dossiers.length} hồ sơ nhưng hủy vị trí và trạng thái rút/lưu trữ hiện hành. Không xóa nhật ký, giữ số LT đã cấp.`)}
function saveTabHtml(){return `<div class="stack"><div class="notice">Lưu dữ liệu từ trình duyệt hiện tại; GitHub Pages <b>không tự đồng bộ</b> giữa điện thoại và máy tính. Bản in và tệp xuất là dữ liệu mới nhất của thiết bị đang dùng.</div>
 <div class="viewonly stack"><div class="strong">In danh sách hồ sơ mới nhất</div><div class="searchbar"><select id="printScope" onchange="printScope=this.value"><option value="ALL" ${printScope==='ALL'?'selected':''}>Tất cả trạng thái, tất cả vị trí</option>${ALL_CELLS.map(c=>`<option value="${c}" ${printScope===c?'selected':''}>Ngăn ${c}</option>`).join('')}<option value="BORROWED" ${printScope==='BORROWED'?'selected':''}>Đang rút</option><option value="ARCHIVED" ${printScope==='ARCHIVED'?'selected':''}>Đã lưu trữ</option><option value="UNPLACED" ${printScope==='UNPLACED'?'selected':''}>Chưa xếp</option></select><button class="btn primary" onclick="setStage('PRINT',{scope:printScope},'In danh sách hồ sơ hiện tại, đủ mã/tên, vị trí, trạng thái, người giữ và số lưu trữ.')">Xem trước in</button></div></div>
 <div class="viewonly stack"><div class="strong">Sao lưu hoặc chuyển dữ liệu</div><div class="btnrow"><button class="btn neutral" onclick="setStage('EXPORT_JSON',{},'Tải bản sao JSON gồm toàn bộ hồ sơ, số LT, thiết lập khóa, giới hạn và nhật ký.')">Xuất JSON</button><button class="btn neutral" onclick="setStage('EXPORT_HTML',{},'Tải index.html nhúng dữ liệu trên trình duyệt hiện tại để tải thủ công lên GitHub.')">Xuất index.html</button><button class="btn neutral" onclick="$('jsonImport').click()">Nhập JSON</button><input class="hidden" id="jsonImport" type="file" accept=".json,application/json" onchange="readImport(this.files?.[0]);this.value=''"/></div></div></div>`;}
async function readImport(file){if(!file)return;try{if(file.size>4_000_000)throw Error('Tệp JSON quá lớn');const raw=JSON.parse(await file.text());const clean=sanitizeDb(raw);setStage('IMPORT',{data:clean},`Thay toàn bộ danh mục đang dùng (${db.dossiers.length}) bằng ${clean.dossiers.length} hồ sơ từ tệp ${file.name}. Giữ bản sao JSON riêng trước khi nhập.`);}catch(e){notice={kind:'error',text:'Không thể nhập JSON: '+e.message};renderGreen()}}
function renderLogsTab(){return `<div class="stack"><div class="row"><span class="strong">Nhật ký thao tác (${db.logs.length})</span><span class="muted tiny">Chỉ xem · Không cần xác nhận</span></div><div class="list">${db.logs.map(l=>`<div class="logrow"><time>${escapeHtml(l.at)}</time>${escapeHtml(l.message)}</div>`).join('')||'<div class="notice">Chưa phát sinh thao tác.</div>'}</div></div>`;}
function renderRed(){renderTabHeader();if(tab==='MOVE'){$('redBody').innerHTML=renderMoveTab();renderMoveList();}else if(tab==='RETURN'){$('redBody').innerHTML=renderReturnTab();renderReturnList();}else if(tab==='ADD')$('redBody').innerHTML=addFormHtml();else if(tab==='SETUP')$('redBody').innerHTML=setupHtml();else if(tab==='SAVE')$('redBody').innerHTML=saveTabHtml();else $('redBody').innerHTML=renderLogsTab();}

function formatSummary(d){return `<div class="viewonly stack"><div class="row"><div><span class="strong">${escapeHtml(d.code)}</span><div class="docname">${escapeHtml(d.name)}</div></div><span class="chip ${statusChip(d)}">${statusText(d)}</span></div><div class="stats"><span class="pill">${escapeHtml(d.status==='BORROWED'?prettyCell(d.lastCell):prettyCell(d.cell))}</span>${d.orderFromBottom?`<span class="pill">Tập #${d.orderFromBottom} từ dưới lên</span>`:''}${d.archiveNo?`<span class="chip archive">${escapeHtml(d.archiveNo)}</span>`:''}</div></div>`}
function returnDiagram(d){const stack=getStack(d.lastCell),top=stack.at(-1),next=stack.length+1;return `<div class="notice amber"><b>SƠ ĐỒ HƯỚNG DẪN TRẢ</b><div class="summary">Vị trí gốc: <strong>${escapeHtml(prettyCell(d.lastCell))}</strong> · trước khi rút: tập #${d.lastOrder||'?'}</div><div style="text-align:center;margin:7px 0;padding:8px;background:#27344a;border-radius:6px">HỒ SƠ TRẢ: <strong>${escapeHtml(d.code)}</strong> → TẬP #${next} (TRÊN CÙNG)<div class="muted tiny">${top?`Đặt đè lên hồ sơ #${top.orderFromBottom} — ${escapeHtml(top.code)}`:'Đặt lên mặt đáy ngăn trống'}</div></div><div class="summary">Người đang giữ: <b>${escapeHtml(d.borrower)}</b>${d.borrowedAt?' · Rút lúc '+escapeHtml(d.borrowedAt):''}. Sau khi xác nhận, hệ thống không cho trả về vị trí cũ.</div></div>`}
function archiveInput(d){const options=ARCHIVE_CELLS.map(c=>`<option ${archiveChoice===c?'selected':''} value="${c}" ${available(c)?'':'disabled'}>${c} · ${occupancy(c)}/${db.capacity}${db.locked.includes(c)?' · Khóa':''}</option>`).join('');return `<div class="field"><label>Chọn ngăn lưu trữ thuộc tầng 6</label><select id="archiveCell" onchange="archiveChoice=this.value">${options}</select></div>`}
function stageArchive(){const d=current(selectedId);if(!d||!['IN_CABINET','BORROWED'].includes(d.status))return;const c=($('archiveCell')?.value||archiveChoice||ARCHIVE_CELLS.find(c=>available(c)));if(!c){notice={kind:'error',text:'Tầng 6 đã đầy hoặc tất cả ngăn bị khóa.'};renderGreen();return;}archiveChoice=c;setStage('ARCHIVE',{id:d.id,cell:c},`Chuyển ${d.code} từ ${prettyCell(d.status==='BORROWED'?d.lastCell:d.cell)} sang ${prettyCell(c)}, trên cùng chồng. Cấp số LT-${String(db.nextArchiveNo).padStart(4,'0')}; không cần trả lại ngăn cũ.`)}
function stageWithdraw(){const d=current(selectedId);if(!d||d.status!=='IN_CABINET')return;const borrower=($('borrowerInput')?.value||borrowDraft).trim();if(!borrower){notice={kind:'error',text:'Cần nhập người hoặc nơi giữ hồ sơ khi rút.'};renderGreen();return;}borrowDraft=borrower;setStage('WITHDRAW',{id:d.id,borrower},`Rút ${d.code} tại ${prettyCell(d.cell)}, tập #${d.orderFromBottom}. Người/nơi giữ: ${borrower}. Các tập phía trên tự động giảm 1.`)}
function defaultActionHtml(){if(tab==='LOG')return `<div class="notice">Nhật ký là chế độ chỉ xem, không có nút xác nhận.</div>`;
 if(tab==='SETUP')return `<div class="stack"><div class="notice">Chọn chức năng <b>Xếp theo năm</b>, <b>Khóa ngăn</b>, <b>Sức chứa</b> hoặc <b>Làm trống tủ</b> tại ô đỏ. Bản xem trước và nút xác nhận sẽ hiện tại đây.</div><div class="stats"><span class="chip">Hạn mức ${db.capacity}/ngăn</span><span class="chip">${db.locked.length} ngăn khóa</span><span class="chip">${db.dossiers.filter(d=>d.status==='UNPLACED').length} chưa xếp</span></div></div>`;
 if(tab==='SAVE')return `<div class="notice">Chọn chức năng In hoặc Xuất dữ liệu tại ô đỏ. Xác nhận thực hiện ở đây.</div>`;
 if(tab==='ADD')return `<div class="notice">Nhập hồ sơ ở ô đỏ, chọn chế độ Mặc định hoặc Chỉ định ngăn và bấm <b>Xem trước thêm</b>. Mã hồ sơ chỉ được ghi khi xác nhận tại ô xanh.</div>`;
 if(tab==='RETURN')return `<div class="notice">Chọn hồ sơ trong danh sách Trả tại ô đỏ. Sơ đồ hướng dẫn và nút xác nhận trả sẽ xuất hiện ở đây.</div>`;
 const d=current(selectedId);if(!d)return `<div class="notice">Nhập tìm hoặc bấm vào dòng hồ sơ tại ô đỏ. Vị trí trên sơ đồ tủ sẽ phát sáng; các tác vụ rút, điều chỉnh hoặc lưu trữ xuất hiện ở đây.</div>`;
 if(d.status==='BORROWED')return `${formatSummary(d)}<div class="notice">Hồ sơ đang rút: <b>${escapeHtml(d.borrower)}</b>. Chuyển sang thẻ <b>Trả hồ sơ</b> để trả, hoặc lưu trữ trực tiếp không phải trả về ngăn cũ.</div>${archiveInput(d)}<div class="btnrow"><button class="btn warning" onclick="stageArchive()">Chuẩn bị lưu trữ</button><button class="btn neutral" onclick="changeTab('RETURN')">Đến danh sách Trả</button></div>`;
 if(d.status==='ARCHIVED')return `${formatSummary(d)}<div class="notice amber">Hồ sơ đã lưu trữ trên tầng 6, được cấp số ${escapeHtml(d.archiveNo||'Chưa có số')}. Không cho rút/trả theo luồng tác nghiệp thường.</div>`;
 if(d.status==='UNPLACED')return `${formatSummary(d)}<div class="notice">Hồ sơ chưa có vị trí tủ. Dùng chức năng Thiết lập → Xếp theo năm để xếp lại.</div>`;
 return `${formatSummary(d)}<div class="grid2"><div class="field"><label>Người / nơi rút hồ sơ</label><input id="borrowerInput" value="${escapeHtml(borrowDraft)}" placeholder="Người lấy hoặc nơi giữ" oninput="borrowDraft=this.value"/></div><div class="field"><label>Ngăn lưu trữ tầng 6</label>${archiveInput(d)}</div></div><div class="btnrow"><button class="btn danger" onclick="stageWithdraw()">Chuẩn bị rút</button><button class="btn warning" onclick="stageArchive()">Chuẩn bị lưu trữ</button></div><div class="screenhint">Điều chỉnh thứ tự: chọn ngăn tại ô đỏ, nhấn ↑ hoặc ↓ trên dòng; xác nhận kết quả tại ô xanh.</div>`;
}
function stagePreview(){const {kind,p,description}=staged,mutating=['REORDER','WITHDRAW','RETURN','ARCHIVE','ADD','ARRANGE','CAPACITY','LOCK','CLEAR','IMPORT'].includes(kind);
 let body='';if(kind==='REORDER'){const list=p.ids.slice().reverse().map(id=>current(id)?.code).join(' · ');body=`<div class="viewonly"><b>Thứ tự mới (trên → dưới):</b><div class="summary">${escapeHtml(list)}</div></div>`;}
 if(kind==='RETURN'){const d=current(p.id);body=d?returnDiagram(d):'';}
 if(kind==='ARCHIVE'){const d=current(p.id);body=d?formatSummary(d):'';}
 if(kind==='CAPACITY'){const blockers=ALL_CELLS.filter(c=>occupancy(c)>p.limit);body=blockers.length?`<div class="notice error">Không thể xác nhận: ngăn ${escapeHtml(blockers.join(', '))} đang vượt giới hạn mới. Hãy xếp lại hoặc tăng hạn mức.</div>`:'';}
 if(kind==='CLEAR')body='<div class="notice error"><b>CẢNH BÁO:</b> Mất toàn bộ vị trí hiện tại và trạng thái đang rút/lưu trữ. Không xóa các hồ sơ và nhật ký. Hãy xuất JSON trước.</div><div class="field"><label>Gõ LAM TRONG TU để xác nhận</label><input id="clearPhrase" autocomplete="off" placeholder="LAM TRONG TU" oninput="toggleClearButton()"/></div>';
 if(kind==='PRINT')body=`<div class="viewonly"><b>Phạm vi:</b> ${escapeHtml(p.scope==='ALL'?'Tất cả hồ sơ':p.scope)}<br>Danh sách hiện có: ${db.dossiers.length} hồ sơ. Bản in có đầy đủ vị trí, trạng thái, số LT, người giữ và thời gian cập nhật.</div>`;
 if(kind==='ARRANGE')body=`<div class="notice">Ưu tiên theo năm, mỗi ngăn tối đa <b>${db.capacity}</b> hồ sơ. ${p.changes} hồ sơ dự kiến thay đổi vị trí. Ngăn khóa và hồ sơ lưu trữ không bị dịch chuyển.</div>`;
 if(kind==='IMPORT')body=`<div class="notice amber">Thao tác này sẽ thay thế toàn bộ dữ liệu trên trình duyệt hiện tại. Tải bản sao JSON trước nếu có dữ liệu cần giữ.</div>`;
 const labels={REORDER:'Xác nhận thứ tự',WITHDRAW:'Xác nhận rút',RETURN:'Xác nhận trả',ARCHIVE:'Xác nhận lưu trữ',ADD:'Xác nhận thêm',ARRANGE:'Xác nhận xếp',CAPACITY:'Xác nhận sức chứa',LOCK:'Xác nhận khóa',CLEAR:'Làm trống tủ',IMPORT:'Xác nhận nhập JSON',EXPORT_JSON:'Xác nhận tải JSON',EXPORT_HTML:'Xác nhận tải HTML',PRINT:'Mở hộp thoại in'};
 return `<div class="rightpreview"><h3>Xem trước: ${escapeHtml(labels[kind]||kind)}</h3><p>${escapeHtml(description)}</p>${body}<div class="confirmline"><button class="btn outline" onclick="discardStage()">Hủy thay đổi</button><button id="stageConfirm" class="btn ${kind==='CLEAR'?'danger':'primary'}" ${kind==='CLEAR'||kind==='CAPACITY'&&p.over?.length?'disabled':''} onclick="commitStaged()">${escapeHtml(labels[kind]||'Xác nhận')}</button></div></div>`;
}
function toggleClearButton(){const x=$('stageConfirm');if(x)x.disabled=($('clearPhrase')?.value||'').trim().toUpperCase()!=='LAM TRONG TU';}
function renderGreen(){if(!$('greenBody'))return;let html='';if(notice)html+=`<div class="notice ${notice.kind==='error'?'error':'success'}" role="status" style="margin-bottom:10px">${escapeHtml(notice.text)}</div>`;
 if(staged){$('actionType').textContent='Chờ xác nhận';html+=stagePreview();}else{$('actionType').textContent=notice?.kind==='success'?'Đã hoàn tất':'Sẵn sàng';html+=defaultActionHtml();}
 $('greenBody').innerHTML=html;}
function preparePrint(scope){const docs=db.dossiers.filter(d=>scope==='ALL'||scope===d.cell||(scope==='BORROWED'&&d.status==='BORROWED')||(scope==='ARCHIVED'&&d.status==='ARCHIVED')||(scope==='UNPLACED'&&d.status==='UNPLACED'));
 const sorted=docs.slice().sort((a,b)=>a.year.localeCompare(b.year)||a.code.localeCompare(b.code,'vi',{numeric:true}));
 $('printArea').innerHTML=`<h1>CÔNG TY ĐẤU GIÁ HỢP DANH MIỀN NAM — DANH SÁCH TỦ HỒ SƠ</h1><p>Thời điểm lập: ${escapeHtml(dateNow())} · Phạm vi: ${escapeHtml(scope==='ALL'?'Toàn bộ':scope)} · Mức tối đa: ${db.capacity} hồ sơ/ngăn · Tổng: ${sorted.length} hồ sơ</p><table><thead><tr><th>STT</th><th>Năm</th><th>Mã hồ sơ</th><th>Hồ sơ / Tài sản</th><th>Đơn vị</th><th>Tầng / Ngăn</th><th>Tập #</th><th>Trạng thái</th><th>Người giữ / Ngày rút</th><th>Số LT</th></tr></thead><tbody>${sorted.map((d,i)=>`<tr><td>${i+1}</td><td>${escapeHtml(d.year)}</td><td>${escapeHtml(d.code)}</td><td>${escapeHtml(d.name)}</td><td>${escapeHtml(d.bank)}</td><td>${escapeHtml(d.status==='BORROWED'?prettyCell(d.lastCell):prettyCell(d.cell))}</td><td>${d.orderFromBottom|| (d.status==='BORROWED'?`Cũ #${d.lastOrder}`:'—')}</td><td>${statusText(d)}</td><td>${escapeHtml([d.borrower,d.borrowedAt].filter(Boolean).join(' · '))}</td><td>${escapeHtml(d.archiveNo||'')}</td></tr>`).join('')}</tbody></table><p class="totals">Trong tủ: ${docs.filter(d=>d.status==='IN_CABINET').length} · Đang rút: ${docs.filter(d=>d.status==='BORROWED').length} · Đã lưu trữ: ${docs.filter(d=>d.status==='ARCHIVED').length} · Chưa xếp: ${docs.filter(d=>d.status==='UNPLACED').length}</p>`;
}
function renderAll(){stateHeader();renderCabinet();renderRed();renderGreen();}
function initialize(){bootstrap();selectedId=db.dossiers.find(d=>d.status==='IN_CABINET')?.id||db.dossiers[0]?.id||null;activeCell=current(selectedId)?.cell||null;archiveChoice=ARCHIVE_CELLS.find(c=>available(c))||'6A';preparePrint('ALL');renderAll();}
if(typeof document!=='undefined')document.addEventListener('DOMContentLoaded',initialize);
</script>
</body>
</html>
